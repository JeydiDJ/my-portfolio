<section id="skills" class="site-section skills-section">
  <div class="section-shell">
    <div class="section-heading skills-heading" appScrollAnimate>
      <h2>My development toolkit.</h2>
      <p>From full-stack applications to enterprise APIs, integrations, and production support.</p>
    </div>
    <div class="skills-grid">
      <section *ngFor="let category of skillCategories; let categoryIndex = index" class="skill-category">
        <h3 appScrollAnimate [revealDelay]="categoryIndex * 75"><span class="category-dot" [style.background]="category.color" aria-hidden="true"></span>{{ category.name }}</h3>
        <div class="skill-list">
          <article *ngFor="let skill of category.skills; let skillIndex = index" class="tool-card" appScrollAnimate [revealDelay]="(skillIndex % 3) * 60 + categoryIndex * 50">
            <span class="tool-icon">
              <img *ngIf="techIconMap[skill.name]" [src]="'assets/tech-icons/' + techIconMap[skill.name]" alt="" width="32" height="32" loading="lazy">
              <svg *ngIf="(skill.name === 'PostgreSQL' || skill.name === 'SQL')" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="16" cy="7" rx="10" ry="4"/><path d="M6 7v18c0 5 20 5 20 0V7M6 16c0 5 20 5 20 0"/></svg>
              <span *ngIf="!techIconMap[skill.name] && skill.name !== 'PostgreSQL' && skill.name !== 'SQL'" aria-hidden="true">{{ fallbackIcon(skill.name) }}</span>
            </span>
            <div class="tool-copy"><h4>{{ skill.name }}</h4><p>{{ skill.description }}</p></div>
          </article>
        </div>
      </section>
    </div>
  </div>
</section>

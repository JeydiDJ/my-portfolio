<section id="skills" class="site-section skills-section">
  <div class="section-shell">
    <div class="section-heading reveal">
      <p class="section-command"><span class="prompt">john@dejesus:~/portfolio$</span> ./stack --show<span class="terminal-caret" aria-hidden="true"></span></p>
      <h2>Capabilities</h2>
      <p>
        The stack below reflects the work I’m doing most often: application interfaces, backend and
        data integration, and delivery across business and government environments.
      </p>
    </div>

    <div class="skills-grid reveal reveal-delay-1">
      <div *ngFor="let category of skillCategories" class="skill-card terminal-subpanel">
        <div class="skill-card-header">
          <h3>{{ category.name }}</h3>
        </div>

        <div class="skill-list">
          <div *ngFor="let skill of category.skills" class="skill-row">
            <div class="skill-topline">
              <div class="skill-name">
                <img [src]="techIconMap[skill.name]" [alt]="skill.name" class="skill-icon" />
                <span>{{ skill.name }}</span>
              </div>
              <span class="skill-level">{{ skill.level }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

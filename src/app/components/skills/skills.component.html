<section id="skills" class="site-section skills-section">
  <div class="section-shell">
    <div class="section-heading skills-heading" appScrollAnimate>
      <h2>My development toolkit.</h2>
      <p>From full-stack applications to enterprise APIs, integrations, and production support.</p>
    </div>
    <div class="skills-grid">
      <section *ngFor="let category of skillCategories; let categoryIndex = index" class="skill-category" appScrollAnimate [revealDelay]="categoryIndex * 90" [attr.aria-labelledby]="'tool-category-' + categoryIndex">
        <header class="category-heading"><app-motion-icon class="category-motion-icon" [name]="categoryMotionIcons[categoryIndex]" aria-hidden="true"></app-motion-icon><h3 [id]="'tool-category-' + categoryIndex">{{ category.name }}</h3><span class="tool-count">{{ category.skills.length }} tools</span></header>
        <div class="tool-grid" [attr.aria-label]="category.name + ' tools'">
          <button *ngFor="let skill of category.skills; let skillIndex = index" type="button" class="tool-tile"
            [class.is-selected]="selectedTools[categoryIndex] === skillIndex" [style.--tool-order]="skillIndex"
            [attr.aria-pressed]="selectedTools[categoryIndex] === skillIndex"
            [attr.aria-describedby]="'tool-detail-' + categoryIndex"
            [attr.tabindex]="selectedTools[categoryIndex] === skillIndex ? 0 : -1"
            (mouseenter)="selectTool(categoryIndex, skillIndex)" (focus)="selectTool(categoryIndex, skillIndex)"
            (click)="selectTool(categoryIndex, skillIndex)" (keydown)="onToolKeydown($event, categoryIndex, skillIndex)">
            <span class="tool-icon"><ng-container *ngTemplateOutlet="toolIcon; context: { $implicit: skill }"></ng-container></span>
            <span class="tool-name">{{ skill.name }}</span>
          </button>
        </div>
        <div class="tool-detail" [id]="'tool-detail-' + categoryIndex">
          <ng-container *ngFor="let skill of category.skills; let skillIndex = index">
            <div *ngIf="selectedTools[categoryIndex] === skillIndex" class="tool-spotlight">
              <span class="spotlight-icon" aria-hidden="true"><ng-container *ngTemplateOutlet="toolIcon; context: { $implicit: skill }"></ng-container></span>
              <div><h4>{{ skill.name }}</h4><p>{{ skill.description }}</p></div>
            </div>
          </ng-container>
        </div>
      </section>
    </div>
    <p class="toolkit-hint">Explore a tool to see where it fits into my work.</p>
  </div>
</section>

<ng-template #toolIcon let-skill>
  <app-motion-icon *ngIf="motionIconMap[skill.name]; else brandToolIcon" [name]="motionIconMap[skill.name]" aria-hidden="true"></app-motion-icon>
  <ng-template #brandToolIcon>
  <img *ngIf="techIconMap[skill.name]" [src]="'assets/tech-icons/' + techIconMap[skill.name]" alt="" width="40" height="40" loading="lazy">
  <span *ngIf="!techIconMap[skill.name]" class="tool-monogram" aria-hidden="true">{{ fallbackIcon(skill.name) }}</span>
  </ng-template>
</ng-template>

<section id="projects" class="site-section projects-section">
  <div class="section-shell">
    <div class="section-heading" appScrollAnimate>
      <h2>A few things I've built<span aria-hidden="true">.</span></h2>
      <p>Real problems, thoughtful solutions. Explore a selection of web apps, business systems, and client work.</p>
    </div>
    <div class="projects-carousel" role="region" aria-roledescription="carousel" aria-label="Selected projects" tabindex="0"
      [class.is-dragging]="dragging" (keydown)="onKeydown($event)"
      (pointerdown)="startDrag($event)" (pointermove)="moveDrag($event)"
      (pointerup)="endDrag($event)" (pointercancel)="endDrag($event)">
      <app-project-card *ngFor="let project of projects; let i = index" class="showcase-card"
        [class.is-center]="offset(i) === 0" [class.is-hidden]="offset(i) < -2 || offset(i) > 2"
        [style.--offset]="offset(i)" [style.--distance]="offset(i) < 0 ? -offset(i) : offset(i)"
        [style.z-index]="10 - (offset(i) < 0 ? -offset(i) : offset(i))"
        [attr.aria-hidden]="offset(i) < -2 || offset(i) > 2 ? 'true' : null"
        [name]="project.name" [logo]="project.logo" [description]="project.description"
        [techStack]="project.techStack" [screenshots]="project.screenshots"
        [liveLink]="project.liveLink" [githubLink]="project.githubLink || ''"
        [carousel]="true" [active]="i === selected" [suppressClick]="suppressClick"
        [previewTabIndex]="i === selected ? 0 : -1" (selectProject)="select(i)">
      </app-project-card>
    </div>
    <div class="showcase-caption">
      <button class="browse-project" type="button" (click)="select(selected - 1)" aria-label="Previous project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
      <div class="selected-project" aria-live="polite" aria-atomic="true"><p class="project-position">0{{ selected + 1 }} <span>/ 0{{ projects.length }}</span></p><h3>{{ projects[selected].name }}</h3><p class="selected-stack">{{ projects[selected].techStack.slice(0, 4).join(' · ') }}</p></div>
      <button class="browse-project" type="button" (click)="select(selected + 1)" aria-label="Next project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    </div>
    <div class="project-picker" aria-label="Choose a project"><button *ngFor="let project of projects; let i = index" type="button" (click)="select(i)" [class.is-active]="selected === i" [attr.aria-label]="'Show ' + project.name" [attr.aria-current]="selected === i ? 'true' : null"><span></span></button></div>
  </div>
</section>

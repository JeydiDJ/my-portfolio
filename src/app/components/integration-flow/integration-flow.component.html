<section class="integration-flow" [attr.aria-label]="flow.label">
  <div class="flow-heading"><h3>{{ flow.title }}</h3><p>{{ flow.description }}</p></div>
  <div class="flow-diagram">
    <svg class="flow-rail flow-horizontal" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
      <path class="flow-track" d="M0 20H1000"/><path class="flow-route" d="M0 20H1000"/>
      <circle class="flow-packet flow-packet-horizontal" cx="0" cy="20" r="4"/><circle class="flow-packet flow-packet-horizontal" cx="0" cy="20" r="4"/>
    </svg>
    <svg class="flow-rail flow-vertical" viewBox="0 0 40 600" preserveAspectRatio="none" aria-hidden="true">
      <path class="flow-track" d="M20 0V600"/><path class="flow-route" d="M20 0V600"/>
      <circle class="flow-packet flow-packet-vertical" cx="20" cy="0" r="4"/><circle class="flow-packet flow-packet-vertical" cx="20" cy="0" r="4"/>
    </svg>
    <ol class="flow-stages">
      <li class="flow-stage" *ngFor="let stage of flow.stages">
        <div class="flow-logo" [class.paired]="stage.icons.length > 1"><img *ngFor="let icon of stage.icons" [src]="'assets/tech-icons/' + icon" alt="" width="48" height="48" loading="lazy"></div>
        <div class="flow-stage-copy"><span class="flow-step">{{ stage.step }}</span><h4>{{ stage.title }}</h4><p>{{ stage.description }}</p></div>
      </li>
    </ol>
  </div>
</section>

<article class="project-card">
  <button #projectTrigger class="project-preview" [class.carousel-preview]="carousel" [class.is-selected]="active" type="button" (click)="activateProject()" [attr.tabindex]="previewTabIndex" [attr.aria-haspopup]="active ? 'dialog' : null" [attr.aria-label]="(active ? 'See more about ' : 'Show ') + name">
    <div class="project-cover">
      <img *ngIf="screenshots.length" [src]="screenshots[0]" alt="" loading="lazy" width="1440" height="900" draggable="false">
      <span class="project-overlay"><span class="project-prompt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>See more</span></span>
    </div>
    <div class="project-summary"><div class="project-brand"><img [src]="logo" alt="" class="project-logo" loading="lazy" width="32" height="32"><h3>{{ name }}</h3></div><span class="project-category">{{ techStack.slice(0, 3).join(' · ') }}</span></div>
  </button>
</article>

<dialog #projectDialog class="project-dialog" [attr.aria-label]="name + ' project details'" (cancel)="$event.preventDefault(); closeProject()" (close)="onDialogClose()" (click)="onBackdropClick($event)">
  <header class="dialog-header"><span>{{ name }}</span><button type="button" class="dialog-close" (click)="closeProject()" aria-label="Close project details" autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
  <div class="project-media" *ngIf="screenshots.length">
    <div #gallery class="project-gallery" [class.is-dragging]="dragging" tabindex="0"
      role="region" aria-roledescription="carousel" [attr.aria-label]="name + ' screenshots. Swipe, drag, or use arrow keys to browse.'"
      (scroll)="onScroll()" (keydown)="onKeydown($event)"
      (pointerdown)="startDrag($event)" (pointermove)="moveDrag($event)"
      (pointerup)="endDrag($event)" (pointercancel)="endDrag($event)" (lostpointercapture)="endDrag($event)">
      <div class="project-slide" *ngFor="let shot of screenshots; let i = index" role="group" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' of ' + screenshots.length">
        <img [src]="shot" [alt]="name + ', screenshot ' + (i + 1)" class="project-shot" loading="lazy" width="1440" height="900" draggable="false" />
      </div>
    </div>
    <span class="sr-only" aria-live="polite" aria-atomic="true">{{ name }}: screenshot {{ currentSlide + 1 }} of {{ screenshots.length }}</span>
  </div>
  <div class="project-body">
    <div class="project-heading">
      <div class="project-brand">
        <img [src]="logo" alt="" class="project-logo" loading="lazy" width="32" height="32" />
        <h3>{{ name }}</h3>
      </div>
      <a *ngIf="liveLink" [href]="liveLink" target="_blank" rel="noreferrer" class="project-visit" [attr.aria-label]="'Visit ' + name">↗</a>
    </div>
    <p class="project-description">{{ description }}</p>
    <ul class="project-tech" aria-label="Technologies"><li *ngFor="let tech of techStack">{{ tech }}</li></ul>
    <div class="project-actions" *ngIf="liveLink || githubLink">
      <a *ngIf="liveLink" [href]="liveLink" target="_blank" rel="noreferrer">Visit website <span aria-hidden="true">↗</span></a>
      <a *ngIf="githubLink" [href]="githubLink" target="_blank" rel="noreferrer">Source code <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</dialog>

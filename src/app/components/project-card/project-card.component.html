<article class="project-card">
  <div class="project-media" *ngIf="screenshots.length">
    <img [src]="screenshots[currentSlide]" [alt]="name + ', screenshot ' + (currentSlide + 1)" class="project-shot" [class.is-expanded]="expanded" loading="lazy" width="1440" height="900" />
  </div>
  <div class="project-body">
    <div class="project-heading">
      <div class="project-brand">
        <img [src]="logo" alt="" class="project-logo" loading="lazy" width="32" height="32" />
        <h3>{{ name }}</h3>
      </div>
      <a *ngIf="liveLink" [href]="liveLink" target="_blank" rel="noreferrer" class="project-visit" [attr.aria-label]="'Visit ' + name">↗</a>
    </div>
    <p class="project-description">{{ description }}</p>
    <ul class="project-tech" aria-label="Technologies">
      <li *ngFor="let tech of techStack">{{ tech }}</li>
    </ul>
    <div class="project-actions">
      <button type="button" (click)="toggle()" [attr.aria-expanded]="expanded">{{ expanded ? 'Close gallery' : 'Explore project' }} <span aria-hidden="true">{{ expanded ? '−' : '+' }}</span></button>
      <a *ngIf="githubLink" [href]="githubLink" target="_blank" rel="noreferrer">Source code <span aria-hidden="true">↗</span></a>
    </div>
    <div *ngIf="expanded && screenshots.length > 1" class="project-carousel-controls" role="group" [attr.aria-label]="name + ' screenshot gallery'">
      <button type="button" (click)="prevSlide()" [attr.aria-label]="'Previous screenshot of ' + name">←</button>
      <span aria-live="polite">{{ currentSlide + 1 }} / {{ screenshots.length }}</span>
      <button type="button" (click)="nextSlide()" [attr.aria-label]="'Next screenshot of ' + name">→</button>
    </div>
  </div>
</article>

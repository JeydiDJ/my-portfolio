<article class="project-card" (click)="toggle()">
  <div class="project-card-main terminal-subpanel">
    <div class="project-body">
      <p class="project-command"><span class="prompt">~/projects$</span> open {{ name | lowercase }}</p>

      <div class="project-heading">
        <div class="project-brand">
          <img [src]="logo" alt="{{ name }} logo" class="project-logo" />
          <div>
            <h3>{{ name }}</h3>
            <p>{{ techStack.join(' / ') }}</p>
          </div>
        </div>

        <button type="button" class="project-toggle" (click)="$event.stopPropagation(); toggle()">
          {{ expanded ? 'close' : 'details' }}
        </button>
      </div>

      <p class="project-description">{{ description }}</p>
    </div>
  </div>

  <div
    #expandableContent
    [style.maxHeight]="maxHeight"
    class="project-expand"
    [class.is-open]="expanded"
  >
    <div class="project-expand-inner terminal-subpanel">
      <div class="project-media" *ngIf="screenshots.length">
        <div *ngIf="screenshots.length > 1" class="project-carousel-controls">
          <button type="button" (click)="$event.stopPropagation(); prevSlide()" aria-label="Previous slide">prev</button>
          <div class="project-dots">
            <span *ngFor="let s of screenshots; let i = index" [class.is-active]="i === currentSlide"></span>
          </div>
          <button type="button" (click)="$event.stopPropagation(); nextSlide()" aria-label="Next slide">next</button>
        </div>
        <img
          [src]="screenshots[currentSlide]"
          [alt]="name + ' preview'"
          class="project-shot"
        />
      </div>

      <div class="project-actions">
        <a *ngIf="liveLink" [href]="liveLink" target="_blank" rel="noreferrer" (click)="$event.stopPropagation()">
          run live-site
        </a>
        <a *ngIf="githubLink" [href]="githubLink" target="_blank" rel="noreferrer" (click)="$event.stopPropagation()">
          open source
        </a>
      </div>

      <div class="project-tech-icons">
        <div *ngFor="let tech of techStack" class="project-tech-item">
          <img
            *ngIf="techIconMap[tech]"
            [src]="techIconMap[tech]"
            [alt]="tech"
            title="{{ tech }}"
          />
          <span>{{ tech }}</span>
        </div>
      </div>
    </div>
  </div>
</article>

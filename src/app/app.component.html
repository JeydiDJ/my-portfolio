<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="section-shell site-nav" aria-label="Main navigation">
    <a class="brand" href="#top" aria-label="John Dave, home"><img src="assets/brand-logo.svg" alt="" width="82" height="52"></a>
    <div class="nav-links" id="main-navigation" [class.is-open]="menuOpen">
      <a href="#top" (click)="menuOpen = false" [class.is-active]="activeSection === 'top'" [attr.aria-current]="activeSection === 'top' ? 'location' : null"><svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10"/></svg>Home</a>
      <a href="#about" (click)="menuOpen = false" [class.is-active]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'location' : null"><svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a8 8 0 0 0-16 0v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></svg>About</a>
      <a href="#projects" (click)="menuOpen = false" [class.is-active]="activeSection === 'projects'" [attr.aria-current]="activeSection === 'projects' ? 'location' : null"><svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v14H3V7Zm5 0V3h8v4M3 12c5 3 13 3 18 0"/></svg>Work</a>
      <a href="#skills" (click)="menuOpen = false" [class.is-active]="activeSection === 'skills'" [attr.aria-current]="activeSection === 'skills' ? 'location' : null"><svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5-7 7 7 7m8-14 7 7-7 7m-3-17-2 20"/></svg>Tools</a>
      <a href="#contact" (click)="menuOpen = false" [class.is-active]="activeSection === 'contact'" [attr.aria-current]="activeSection === 'contact' ? 'location' : null"><svg class="nav-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3V5Zm0 1 9 7 9-7"/></svg>Contact</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="darkMode ? 'Switch to light theme' : 'Switch to dark theme'" [attr.aria-pressed]="darkMode">
        <svg *ngIf="!darkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.8 13A8.5 8.5 0 0 1 11 3.2 8.5 8.5 0 1 0 20.8 13Z"/></svg>
        <svg *ngIf="darkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
      <a class="button button-primary nav-contact" href="#contact">Let's talk <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 11h8m-8 4h5"/></svg></a>
      <button class="menu-toggle" [class.is-open]="menuOpen" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation" [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path class="menu-line-top" d="M4 8h16"/><path class="menu-line-bottom" d="M4 16h16"/></svg></button>
    </div>
  </nav>
</header>
<button *ngIf="menuOpen" class="menu-backdrop" type="button" tabindex="-1" (click)="closeMenu()" aria-label="Close navigation menu"></button>
<main id="main" tabindex="-1" appPortfolioMotion>
  <app-hero></app-hero>
  <app-about></app-about>
  <app-projects></app-projects>
  <app-skills></app-skills>
  <app-contact></app-contact>
</main>
<footer class="site-footer section-shell">
  <a class="brand" href="#top" aria-label="Back to top"><img src="assets/brand-logo.svg" alt="" width="82" height="52" loading="lazy"></a>
  <p>© {{ year }} John Dave De Jesus</p>
  <a href="#top">Back to top <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg></a>
</footer>
<button type="button" class="back-to-top" [class.is-visible]="showBackToTop" (click)="scrollToTop()"
  aria-label="Scroll to top" title="Back to top" [attr.aria-hidden]="showBackToTop ? null : 'true'" [attr.tabindex]="showBackToTop ? 0 : -1">
  <svg class="scroll-progress" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <circle class="progress-track" cx="32" cy="32" r="29"/>
    <circle class="progress-value" cx="32" cy="32" r="29" pathLength="100" [attr.stroke-dashoffset]="100 - scrollProgress"/>
  </svg>
  <svg class="back-to-top-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20V4m-7 7 7-7 7 7"/></svg>
</button>

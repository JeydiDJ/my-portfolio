<main class="portfolio-page">
  <div class="ambient ambient-mouse" aria-hidden="true"></div>
  <div class="ambient ambient-glows" aria-hidden="true">
    <span class="glow glow-a"></span>
    <span class="glow glow-b"></span>
    <span class="glow glow-c"></span>
  </div>
  <div class="ambient ambient-orbits" aria-hidden="true">
    <span class="orbit orbit-a"></span>
    <span class="orbit orbit-b"></span>
    <span class="orbit orbit-c"></span>
  </div>
  <div class="ambient ambient-nodes" aria-hidden="true">
    <span class="node node-a"></span>
    <span class="node node-b"></span>
    <span class="node node-c"></span>
    <span class="node node-d"></span>
    <span class="node-link link-a"></span>
    <span class="node-link link-b"></span>
  </div>
  <div class="ambient ambient-rain" aria-hidden="true">
    <span class="rain-column rain-a">101101<br>root<br>sync<br>$</span>
    <span class="rain-column rain-b">git<br>init<br>push<br>0x7f</span>
    <span class="rain-column rain-c">&lt;div&gt;<br>api<br>run<br>_</span>
  </div>
  <div class="ambient ambient-glyphs" aria-hidden="true">
    <span class="glyph glyph-a">[ ]</span>
    <span class="glyph glyph-b">+</span>
    <span class="glyph glyph-c">&lt;/&gt;</span>
    <span class="glyph glyph-d">x</span>
  </div>
  <div class="ambient ambient-cursors" aria-hidden="true">
    <span class="cursor-echo cursor-a"></span>
    <span class="cursor-echo cursor-b"></span>
    <span class="cursor-echo cursor-c"></span>
  </div>
  <div class="ambient ambient-wireframes" aria-hidden="true">
    <span class="wire wire-a"></span>
    <span class="wire wire-b"></span>
  </div>
  <div class="ambient ambient-pulses" aria-hidden="true">
    <span class="pulse-strip pulse-left"></span>
    <span class="pulse-strip pulse-right"></span>
  </div>
  <div class="ambient ambient-noise" aria-hidden="true"></div>
  <div class="ambient ambient-scan" aria-hidden="true"></div>
  <app-hero></app-hero>
  <app-projects></app-projects>
  <app-about></app-about>
  <app-skills></app-skills>
  <app-contact></app-contact>
</main>
